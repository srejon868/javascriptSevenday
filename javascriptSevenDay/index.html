<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payooo</title>
    <!-- DaisyUI -->
    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@5"
        rel="stylesheet"
        type="text/css"
    >
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Finlandica+Text:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body {
            font-family: "Finlandica Text", sans-serif !important;
        }
    </style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
      
    <div class="logo  w-[200px] mx-auto pt-32">
        <img src="./assets/Logo-full.png" alt="">


    </div>

    <div class="form pt-14">
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral-700 font-bold">MObile Number</label>
          <input type="text" id="inputMobileNum" maxlength="11" minlength="11" class="input rounded-full" placeholder="Enter your number" />
          <label class="label text-neutral-700 font-bold">4 Digit Pin</label>
          <input type="password" id="Pin-input" maxlength="4" minlength="4" class="input rounded-full" placeholder="Password" />
          <button  id="loginBtn" class="btn btn-neutral mt-4 text-white bg-[#3B25C1] font-bold rounded-full">Login</button>
        </fieldset>
      </div>
    </div>
    </div>

    <!-- all -script-file-here -->
     <script src="login.js"></script>
</body>
</html>
